<h1>Contact Adam Fistler - Behavioral Change Consultant</h1>

<form
  class="contact-form"
  action="/cgi-bin/contact_adam.py"
  method="post"
>

  <p class="form-introduction">
    Your message will be sent directly to Adam Fistler.
    Please provide a valid email address so that I can respond to you.
  </p>


  <!-- ======================================================
       NAME
       ====================================================== -->

  <div class="form-row">

    <label
      class="form-label"
      for="name"
    >
      <span class="form-label-text">
        Name
      </span>
      <span class="form-required">
        *
      </span>
      <span class="form-colon">
        :
      </span>
    </label>

    <input
      class="form-control"
      type="text"
      id="name"
      name="name"
      required
    >

  </div>


  <!-- ======================================================
       EMAIL
       ====================================================== -->

  <div class="form-row">

    <label
      class="form-label"
      for="email"
    >
      <span class="form-label-text">
        Email
      </span>
      <span class="form-required">
        *
      </span>
      <span class="form-colon">
        :
      </span>
    </label>

    <input
      class="form-control"
      type="email"
      id="email"
      name="email"
      placeholder="Email address"
      required
    >

  </div>


  <!-- ======================================================
       PHONE
       ====================================================== -->

  <div class="form-row">

    <label
      class="form-label"
      for="phone"
    >
      <span class="form-label-text">
        Phone
      </span>
      <span class="form-required">
      </span>
      <span class="form-colon">
        :
      </span>
    </label>

    <input
      class="form-control"
      type="tel"
      id="phone"
      name="phone"
      placeholder="(609) 200-0230"
    >

  </div>


  <!-- ======================================================
       SUBJECT
       ====================================================== -->

  <div class="form-row">

    <label
      class="form-label"
      for="subject"
    >
      <span class="form-label-text">
        Subject
      </span>
      <span class="form-required">
        *
      </span>
      <span class="form-colon">
        :
      </span>
    </label>

    <!-- SELECTBOX subject -->

  </div>


  <!-- ======================================================
       MESSAGE
       ====================================================== -->

  <div class="form-row">

    <label
      class="form-label form-message-label"
      for="message"
    >
      <span class="form-label-text">
        Message
      </span>
      <span class="form-required">
        *
      </span>
      <span class="form-colon">
        :
      </span>
    </label>

    <textarea
      class="form-textarea"
      id="message"
      name="message"
      required
    ></textarea>

  </div>


  <!-- ======================================================
       SUBMIT
       ====================================================== -->

  <div class="form-submit-row">

    <div></div>

    <div class="form-submit">

      <button
        type="submit"
      >
        Send Message
      </button>

    </div>

  </div>

</form>
