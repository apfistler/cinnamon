<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 80 340 340" width="100%" height="100%">
  <style>
    .padlock-path {
      fill: none;
      stroke: #1a1a1a;
      stroke-width: 16;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <g transform="translate(0, 0)">
    <!-- Unlocked Shackle (Lifted and Rotated Open) -->
    <path class="padlock-path" d="
      M 200,230
      V 175
      A 50,50 0 0,1 300,175
      V 210
    " />

    <!-- Solid Lock Body Base -->
    <rect x="150" y="230" width="200" height="150" rx="24" class="padlock-path" />

    <!-- Keyhole / Center Release Detail -->
    <circle cx="250" cy="295" r="10" class="padlock-path" />
    <path class="padlock-path" d="M 250,305 V 325" />
  </g>
</svg>

