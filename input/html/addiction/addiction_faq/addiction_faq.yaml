name: addiction_faq
category: addiction
title: Addiction & Recovery Frequently Asked Questions
description: Frequently asked questions about addiction, recovery, behavior change,
  SMART Recovery, hypnosis and addiction, cravings, relapse, recovery approaches,
  and my approach to helping people make lasting changes.
keywords:
- addiction FAQ
- addiction recovery
- behavior change
- subconscious habit change
- emotional regulation
topic_areas:
- name: understanding_addiction
  title: Understanding Addiction
  questions:
  - question: What is addiction?
    response: >-
      Addiction is a commonly used term for a persistent pattern of substance use
      or behavior that becomes difficult to control and continues despite negative
      consequences. In everyday language, people often use the word addiction to describe
      psychological dependence, physical dependence, compulsive behavior, or combinations
      of these. Addiction is not simply a matter of lacking willpower. It can involve
      learned patterns, reinforcement, emotions, beliefs, habits, environmental cues,
      expectations, and the ways a person has learned to respond to discomfort or
      other needs.
  - question: Is addiction simply a lack of willpower?
    response: >-
      No. While personal choices and behavior are important parts of recovery, addiction
      is considerably more complicated than simply deciding whether or not to use.
      Repeated behaviors can become deeply learned patterns associated with particular
      thoughts, emotions, situations, people, places, and expectations. Recovery involves
      learning how to recognize and change those patterns rather than simply telling
      yourself to have more willpower.
  - question: Why is it so difficult to stop an addictive behavior?
    response: >-
      Addictive behavior can become connected to powerful habits, emotional responses,
      environmental cues, beliefs, expectations, and reinforcement. The behavior may
      also serve a perceived purpose, such as relieving stress, avoiding uncomfortable
      emotions, providing stimulation, or temporarily changing how a person feels.
      Stopping the behavior therefore often means learning new ways to respond to
      the situations and internal experiences that previously triggered it.
  - question: Why do people continue an addiction even when they know it is hurting
      them?
    response: >-
      Knowing that something is harmful does not automatically change the learned
      behavior associated with it. People can simultaneously understand the long-term
      consequences and still experience powerful short-term motivation to continue.
      Recovery involves bridging that gap between intellectual understanding and actual
      behavior.
  - question: Is addiction only about drugs and alcohol?
    response: >-
      No. Addiction can involve substances as well as problematic or addictive behaviors.
      Examples can include gambling and other compulsive behaviors. SMART Recovery,
      for example, focuses on addictive behaviors rather than limiting its approach
      to a particular substance.
  - question: Is addiction permanent?
    response: >-
      Addiction does not have to define the rest of a person's life. People can learn
      new behaviors, develop new coping strategies, change their environments, and
      build lives that make the addictive behavior less compelling. Recovery is a
      process of change rather than a permanent identity.
  - question: What causes addiction?
    response: >-
      There is no single cause. Addiction can develop through a combination of biological,
      psychological, behavioral, social, environmental, and experiential factors.
      Different people can arrive at similar addictive behaviors through very different
      pathways.
  - question: Is addiction a medical diagnosis?
    response: >-
      Addiction is widely used in everyday and professional conversation, but it is
      not itself the formal diagnostic label used by the DSM-5. For substance-related
      problems, the DSM-5 uses the diagnosis Substance Use Disorder, or SUD. SUD is
      diagnosed by evaluating a person's pattern of substance use against specific
      diagnostic criteria, with severity classified according to the number of criteria
      that are present.
  - question: What is Substance Use Disorder?
    response: >-
      Substance Use Disorder, commonly abbreviated SUD, is the DSM-5 diagnosis used
      to describe a problematic pattern of substance use that causes clinically significant
      impairment or distress. The diagnosis is based on specific symptoms and patterns
      of behavior rather than simply on how often someone uses a substance or whether
      the person considers themselves addicted.
  - question: What is the difference between addiction and Substance Use Disorder?
    response: >-
      Addiction is the common term people generally use to describe a persistent and
      difficult-to-control pattern of substance use or behavior. Substance Use Disorder
      is the formal clinical diagnosis used by the DSM-5 for problematic substance
      use. The concepts overlap considerably, but the terms are not technically interchangeable
      in a diagnostic context.
  - question: What is the difference between substance abuse and addiction?
    response: >-
      Substance abuse is an older clinical term that many people still use in everyday
      conversation. In DSM-IV, substance abuse and substance dependence were separate
      diagnostic categories. DSM-5 replaced those categories with the single diagnosis
      Substance Use Disorder, with mild, moderate, or severe classification based
      on the number of diagnostic criteria met.
  - question: What are the 11 criteria used to diagnose Substance Use Disorder?
    response: >-
      The DSM-5 evaluates 11 criteria when determining whether a person has a Substance
      Use Disorder. They include:


      • Using the substance in larger amounts or for longer than intended. • Wanting
      to cut down or control use but being unable to do so. • Spending a great deal
      of time obtaining, using, or recovering from the substance. • Experiencing craving
      or a strong desire or urge to use. • Recurrent use interfering with major responsibilities
      at work, school, or home. • Continuing to use despite recurrent social or interpersonal
      problems caused or worsened by use. • Giving up or reducing important activities
      because of substance use. • Repeatedly using the substance in physically hazardous
      situations. • Continuing to use despite knowing that the substance is causing
      or worsening a physical or psychological problem. • Developing tolerance, meaning
      that increasingly larger amounts may be needed to achieve the desired effect,
      or that the same amount produces less effect. • Experiencing withdrawal symptoms,
      or using the substance to relieve or avoid withdrawal.


      These criteria look at the person's overall pattern of substance use and its
      consequences rather than simply asking how frequently the substance is used.
  - question: How many of the 11 criteria are required to have Substance Use Disorder?
    response: >-
      A person does not have to meet all 11 criteria. Under DSM-5, meeting two or
      three criteria corresponds to mild Substance Use Disorder, four or five criteria
      corresponds to moderate Substance Use Disorder, and six or more criteria corresponds
      to severe Substance Use Disorder.


      This is an important distinction from the idea that a person must have several
      different areas of their life affected before they can be considered to have
      a substance use problem. The DSM-5 diagnosis is based on the presence of its
      specific criteria.
  - question: Does someone have to use drugs or alcohol every day to have Substance
      Use Disorder?
    response: >-
      No. Frequency of use by itself does not determine whether someone meets the
      criteria for Substance Use Disorder. A person can have a significant substance-related
      problem without using every day, while frequent use does not automatically mean
      that someone meets the diagnostic criteria. The overall pattern of use and the
      specific symptoms and consequences described by the DSM-5 criteria are what
      matter.
  - question: Does having Substance Use Disorder mean someone is an "addict"?
    response: >-
      Not necessarily. Addict is a commonly used label, but it is not the DSM-5 diagnostic
      terminology. A person can meet criteria for Substance Use Disorder without needing
      to adopt the identity or label of "addict." In my approach, I prefer to focus
      on the person's behavior, circumstances, patterns, and ability to make changes
      rather than making the diagnosis or label the person's identity.
- name: cravings_urges_and_triggers
  title: Cravings, Urges and Triggers
  questions:
  - question: What is a craving?
    response: >-
      A craving is a strong desire or urge to engage in a particular behavior. Cravings
      can be triggered by external situations, memories, emotions, thoughts, physical
      sensations, routines, people, places, or expectations. A craving can be powerful
      without being a command that you must obey.
  - question: What is a trigger?
    response: >-
      A trigger is something that increases the likelihood of an urge or addictive
      behavior. Triggers can be external, such as a particular location or person,
      or internal, such as stress, anger, loneliness, boredom, anxiety, or a particular
      thought.
  - question: Do cravings eventually go away?
    response: >-
      Cravings can change in intensity and duration. One important recovery skill
      is learning that an urge can be experienced without automatically acting on
      it. Learning to recognize, tolerate, question, and respond differently to urges
      is an important part of many recovery approaches.
  - question: What should I do when I have a strong urge?
    response: >-
      There is no single technique that works for everyone. Recovery tools can include
      identifying the trigger, examining the thoughts surrounding the urge, delaying
      the behavior, changing your environment, distracting yourself, contacting support,
      examining the likely consequences, and using specific coping strategies. The
      goal is to build a collection of tools rather than depend upon one technique.
  - question: Can avoiding every trigger solve addiction?
    response: >-
      Avoiding dangerous situations can be useful, particularly early in recovery,
      but avoiding every possible trigger is usually not a complete solution. Life
      will eventually present difficult emotions, situations, and unexpected reminders.
      Developing the ability to handle those experiences is an important part of building
      long-term resilience.
- name: recovery
  title: Recovery
  questions:
  - question: What does recovery mean?
    response: >-
      Recovery means making meaningful changes that allow you to move away from addictive
      behavior and toward the life you want to live. Recovery is more than simply
      stopping a behavior. It can also involve developing healthier habits, improving
      relationships, managing emotions, building purpose, and learning how to handle
      everyday life without relying on the addictive behavior.
  - question: Does recovery mean I have to use one particular program?
    response: >-
      No. There are many approaches to recovery. Some people use professional treatment,
      peer support, SMART Recovery, 12-Step programs, counseling, medication when
      appropriate, behavioral approaches, or combinations of different resources.
      What matters is finding approaches that are appropriate for your circumstances
      and that help you make meaningful progress.
  - question: Does recovery have to involve meetings?
    response: >-
      Meetings can provide valuable support and education, but recovery is ultimately
      something you practice in your everyday life. A meeting can provide tools, perspective,
      encouragement, and interaction with other people working on similar problems.
      The challenge is taking what you learn and applying it outside the meeting.
  - question: What is the difference between support and dependency?
    response: >-
      Support can help you develop the knowledge, skills, confidence, and resources
      necessary to handle life more effectively. Dependency occurs when the support
      itself becomes something you feel unable to function without. One of the principles
      I value in recovery is helping people develop increasing self-reliance and confidence
      in their own ability to make decisions and solve problems.
  - question: What happens if I relapse?
    response: >-
      A return to addictive behavior is important information, not a reason to conclude
      that recovery is impossible. It is an opportunity to examine what happened,
      identify the thoughts, emotions, situations, decisions, and circumstances that
      contributed to it, and determine what can be changed. A relapse should be taken
      seriously while avoiding the all-or-nothing thinking that can turn one setback
      into a complete return to old patterns.
- name: treatment_rehab_and_recovery_programs
  title: Treatment, Rehab and Recovery Programs
  questions:
  - question: Does going to rehab automatically solve addiction?
    response: >-
      No. Treatment can provide structure, safety, education, medical care, counseling,
      and support, but completing a treatment program does not automatically change
      every pattern that contributed to an addiction. What happens after treatment
      and how a person applies what they learned can be just as important as the treatment
      experience itself.
  - question: Why do some people go through treatment more than once?
    response: >-
      Addiction can involve deeply learned patterns that do not disappear simply because
      someone completed a treatment program. A person may also return to an environment
      containing the same stresses, relationships, habits, or triggers that contributed
      to the problem. Repeated treatment can sometimes indicate that the person needs
      a different approach or additional support rather than simply more of the same
      treatment.
  - question: Are all rehab programs the same?
    response: >-
      No. Treatment programs vary considerably in philosophy, staffing, services,
      medical capabilities, therapeutic approaches, length, cost, and aftercare. It
      is important to understand what a particular program actually provides rather
      than relying only on its advertising.
  - question: Is 12-Step recovery the only way to recover?
    response: >-
      No. Twelve-Step programs are one recovery pathway among several. Millions of
      people have participated in them, and some people find them extremely valuable.
      Other people prefer approaches that emphasize self-management, behavioral skills,
      secular recovery, medication, professional treatment, or combinations of approaches.
  - question: Are CBT and DBT always provided in rehab when a facility advertises
      them?
    response: >-
      Not necessarily in the way a person might assume from an advertisement. A facility
      may incorporate elements of CBT or DBT without providing a comprehensive individual
      CBT or DBT treatment program. If this matters to you, ask exactly what services
      are provided, who provides them, how often they occur, and what qualifications
      the providers have.
- name: hypnosis_and_addiction_recovery
  title: Hypnosis and Addiction Recovery
  questions:
  - question: Can hypnosis help with addiction?
    response: >-
      Hypnosis may be useful as one component of a broader approach to behavior change
      and recovery. My approach focuses on the learned patterns, expectations, emotions,
      beliefs, habits, and automatic responses that can contribute to addictive behavior.
      Hypnosis can provide a way of working deliberately with attention, imagination,
      suggestion, emotional responses, and other processes involved in changing behavior.
  - question: Does hypnosis cure addiction?
    response: >-
      I do not present hypnosis as a magic cure or guarantee that addiction will disappear
      after a particular number of sessions. Hypnosis is a tool for helping people
      make changes. The goal is to understand what maintains the behavior and help
      develop different responses. For some people, hypnosis may be useful as part
      of a broader recovery plan.
  - question: How can hypnosis be used in addiction recovery?
    response: >-
      Hypnosis can be used to help a person deliberately work with automatic responses,
      habits, expectations, emotional associations, imagery, and other learned patterns.
      Rather than simply telling someone not to engage in an addictive behavior, the
      work can focus on understanding what the behavior has been doing for the person
      and developing healthier responses to the situations in which the old behavior
      normally appears.
  - question: Is addiction stored in the subconscious mind?
    response: >-
      I often use the term subconscious as a practical way of describing processes
      that operate outside ordinary conscious awareness. Addiction involves learned
      associations, automatic responses, habits, expectations, emotions, and other
      processes that may operate without deliberate conscious thought. Hypnosis provides
      one method for deliberately working with some of those processes.
  - question: Can hypnosis replace addiction treatment?
    response: >-
      Hypnosis should not automatically be considered a replacement for medical or
      professional addiction treatment. Depending on the substance and circumstances,
      withdrawal can be medically dangerous, and some people need medical supervision,
      medication, counseling, residential treatment, or other professional services.
      Hypnosis can be considered as a complementary behavioral approach when appropriate.
  - question: Do I need to stop attending recovery meetings if I use hypnosis?
    response: >-
      No. Hypnosis does not require abandoning other recovery resources. A person
      can use hypnosis while also participating in SMART Recovery, counseling, professional
      treatment, or other appropriate support. My goal is not to create dependence
      on hypnosis but to help people develop greater ability to manage their own behavior.
  - question: What makes your approach to addiction different?
    response: >-
      I am interested in what is actually maintaining the behavior rather than simply
      labeling the person or repeatedly telling them that they should stop. My approach
      combines my experience with hypnosis and behavior change with concepts from
      recovery education, CBT, DBT, mindfulness, motivational approaches, and SMART
      Recovery. The emphasis is on understanding patterns and developing practical
      ways to change them.
- name: smart_recovery
  title: SMART Recovery
  questions:
  - question: What is SMART Recovery?
    response: >-
      SMART Recovery is a secular, evidence-informed recovery program that helps people
      address addictive behaviors through self-management, practical tools, education,
      and mutual support. SMART stands for Self-Management and Recovery Training.
      The program is not limited to one particular substance and can be used for a
      variety of addictive or problematic behaviors.
  - question: What are the four points of SMART Recovery?
    response: >-
      SMART Recovery's 4-Point Program focuses on four major areas: building and maintaining
      motivation; coping with urges and cravings; managing thoughts, feelings, and
      behaviors; and living a balanced life. The four points provide a framework around
      which SMART Recovery tools and discussions are organized.
  - question: What is the goal of SMART Recovery?
    response: >-
      A major goal of SMART Recovery is to help people develop the knowledge, skills,
      confidence, and self-management abilities needed to make changes in their own
      lives. Rather than making the group itself the solution, SMART teaches tools
      that participants can take with them and use in everyday situations.
  - question: Is SMART Recovery a 12-Step program?
    response: >-
      No. SMART Recovery and traditional 12-Step programs are different approaches.
      SMART Recovery is secular and emphasizes self-management, personal agency, practical
      tools, behavioral skills, and education. It does not require belief in a higher
      power.
  - question: Does SMART Recovery believe that people are powerless over addiction?
    response: >-
      SMART Recovery takes a different approach from the traditional 12-Step concept
      of powerlessness. SMART emphasizes self-empowerment and personal responsibility
      for making changes. The purpose is not to pretend that addiction is easy to
      control, but to help people develop practical tools for managing urges, thoughts,
      emotions, decisions, and behaviors.
  - question: Does SMART Recovery require a belief in God or a higher power?
    response: >-
      No. SMART Recovery is secular and does not require participants to adopt a particular
      religious or spiritual belief system. The program emphasizes self-management
      and the individual's ability to work toward change.
  - question: Do I have to attend a SMART Recovery meeting every day?
    response: >-
      No. SMART Recovery does not require daily meeting attendance. Meetings are generally
      structured around learning, practicing, and discussing recovery tools that participants
      can apply during the rest of the week. Many groups meet weekly, although people
      can choose to attend more often if they find additional meetings useful.
  - question: Why doesn't SMART Recovery require me to attend meetings every day?
    response: >-
      SMART Recovery places considerable emphasis on applying recovery tools in everyday
      life. The meeting is a place to learn, practice, discuss, and receive support;
      everyday life is where those skills are actually used. The emphasis is therefore
      on developing self-management and self-efficacy rather than making frequent
      meeting attendance the central mechanism of recovery.
  - question: Does SMART Recovery have sponsors?
    response: >-
      No. SMART Recovery does not use the traditional sponsor system or a sponsorship
      requirement. Its current meeting guidance specifically emphasizes independence
      rather than a sponsorship or buddy system. The philosophy is to help participants
      learn tools and apply them for themselves rather than making another individual
      responsible for managing their recovery.
  - question: Does SMART Recovery have mentors?
    response: >-
      SMART Recovery does not have the traditional sponsor system found in many 12-Step
      fellowships. A facilitator may provide guidance, education, and encouragement,
      but the facilitator is not intended to become a person's personal recovery manager.
  - question: What is a SMART Recovery facilitator?
    response: >-
      A SMART Recovery facilitator is a trained person who guides the meeting, presents
      SMART Recovery concepts and tools, encourages productive discussion, and helps
      maintain an appropriate meeting environment. The facilitator functions more
      like a guide and educator than a sponsor, therapist, life coach, or manager.
  - question: Can anyone start a SMART Recovery group?
    response: >-
      A person cannot simply declare an independent meeting to be an official SMART
      Recovery meeting. SMART Recovery requires facilitators to complete the appropriate
      facilitator training, and meetings must be registered through SMART Recovery.
      The facilitator training and meeting registration provide a level of consistency
      and quality control.
  - question: What does a SMART Recovery facilitator learn?
    response: >-
      Facilitator training prepares people to understand and present the SMART Recovery
      program, use its tools, facilitate group discussions, handle challenging situations,
      and guide participants through the 4-Point Program. The facilitator also learns
      how to keep the meeting focused on SMART Recovery principles rather than turning
      the meeting into individual therapy or a traditional 12-Step meeting.
  - question: How is SMART Recovery different from a 12-Step meeting?
    response: >-
      There are several important philosophical differences. Traditional 12-Step programs
      commonly emphasize powerlessness over the substance or behavior, surrender to
      a higher power, and sponsorship. SMART Recovery instead emphasizes self-management,
      personal agency, practical tools, education, and self-empowerment. SMART Recovery
      also encourages interaction and discussion among participants rather than treating
      cross-talk as something that must generally be avoided.
  - question: Does SMART Recovery criticize 12-Step programs?
    response: >-
      SMART Recovery and 12-Step programs are different approaches, but a person does
      not necessarily have to treat them as enemies. Some people use SMART Recovery
      alongside other recovery resources. My purpose in explaining the differences
      is to help people understand their options, not to tell someone that one recovery
      pathway is universally right for everyone.
- name: what_is_a_smart_recovery_meeting_like
  title: What Is a SMART Recovery Meeting Like?
  questions:
  - question: What happens at a SMART Recovery meeting?
    response: >-
      A typical SMART Recovery meeting begins with an introduction or welcome, followed
      by a check-in or discussion of current successes, challenges, questions, or
      goals. The facilitator and group then work with a SMART Recovery tool, concept,
      or issue relevant to the group. Discussion and interaction are encouraged, followed
      by a closing or checkout.
  - question: What is the purpose of the SMART Recovery check-in?
    response: >-
      The check-in is intended to identify what has been happening since the previous
      meeting. Participants can discuss successes, difficulties, questions, urges,
      goals, or areas where they need help. It is not meant to be an opportunity to
      tell every detail of one's entire life story. Keeping the check-in focused allows
      more time for the educational and practical portion of the meeting.
  - question: Do I have to tell my entire story at a SMART Recovery meeting?
    response: >-
      No. SMART Recovery meetings are generally focused on current issues, recovery
      goals, practical problems, and useful solutions. Participation is encouraged,
      but people are not required to disclose everything about themselves. Someone
      who is uncomfortable speaking can generally choose to pass.
  - question: What is the main part of a SMART Recovery meeting?
    response: >-
      The heart of the meeting is learning and applying SMART Recovery tools. The
      group may examine a particular problem, learn a recovery concept, complete a
      worksheet, practice a skill, discuss different ways of handling a situation,
      or apply a tool to a real problem presented by a participant.
  - question: Does SMART Recovery allow cross-talk?
    response: >-
      Yes. Interaction and constructive discussion among members are an important
      part of SMART Recovery. Members can respond to one another, discuss ideas, ask
      questions, and share possible solutions. The goal is productive interaction
      rather than turning the meeting into a series of isolated personal stories.
  - question: How large should a SMART Recovery group be?
    response: >-
      In my experience, smaller groups are particularly useful because SMART Recovery
      depends on interaction, discussion, education, and practice. A group of around
      twelve or fewer allows the facilitator to give members meaningful attention
      and leaves enough time for discussion. When a group becomes substantially larger,
      splitting into smaller groups can make the educational and interactive portions
      more effective.
  - question: Why are smaller SMART Recovery groups useful?
    response: >-
      SMART Recovery is not simply a lecture. Participants are expected to interact,
      ask questions, practice tools, and discuss how the tools apply to their own
      situations. As a group becomes larger, it becomes increasingly difficult for
      one facilitator to provide enough opportunity for everyone to participate and
      understand what is being taught.
  - question: Can a SMART Recovery group have a co-host or assistant?
    response: >-
      Some SMART Recovery meetings use additional trained people to assist with meeting
      management and facilitation. In a larger meeting, appropriately trained assistants
      can help make smaller discussion groups practical. The exact structure depends
      on the meeting and SMART Recovery's current requirements.
- name: smart_recovery_tools_and_skills
  title: SMART Recovery Tools and Skills
  questions:
  - question: What kinds of tools does SMART Recovery teach?
    response: >-
      SMART Recovery uses practical exercises and tools addressing motivation, urges,
      thoughts, feelings, behaviors, decision making, problem solving, and lifestyle
      balance. Examples include examining the costs and benefits of a behavior, identifying
      triggers, working with thoughts and beliefs, developing change plans, managing
      urges, and practicing alternative responses.
  - question: What types of psychology are behind SMART Recovery?
    response: >-
      SMART Recovery's tools are grounded in cognitive and behavioral approaches and
      have evolved over time. The program draws particularly on approaches such as
      cognitive behavioral and rational-emotive behavioral principles, motivational
      concepts, and practical behavior-change strategies.
  - question: Are SMART Recovery tools only useful during meetings?
    response: >-
      No. The purpose of the tools is to give participants practical methods they
      can use outside the meeting. A worksheet or exercise completed in the meeting
      becomes much more valuable when the person recognizes a similar situation during
      the week and knows how to apply the tool.
  - question: Are SMART Recovery tools free?
    response: >-
      SMART Recovery provides many tools, worksheets, and educational resources through
      its website. Meetings are also free to attend, although SMART Recovery is a
      nonprofit organization that accepts donations.
- name: smart_recovery_vs_12_step
  title: SMART Recovery vs. 12-Step
  questions:
  - question: Why do people compare SMART Recovery and 12-Step programs?
    response: >-
      Both provide peer support for people dealing with addiction and both can provide
      community, encouragement, and recovery resources. The major differences are
      in their underlying philosophies, meeting structure, concepts of personal agency,
      spirituality, sponsorship, and the types of tools used.
  - question: What does a 12-Step program mean by powerlessness?
    response: >-
      Traditional 12-Step programs commonly begin from the concept that a person is
      powerless over the substance or addictive behavior and that recovery involves
      admitting that powerlessness and seeking help through the Twelve Steps. SMART
      Recovery approaches the issue differently by emphasizing self-management, choice,
      and developing practical skills.
  - question: Why doesn't SMART Recovery use sponsors?
    response: >-
      SMART Recovery is intentionally structured around self-management and independence.
      Rather than assigning a sponsor to act as a personal recovery guide, SMART teaches
      participants tools and encourages them to use those tools themselves.
  - question: What is a sponsor in a 12-Step program?
    response: >-
      A sponsor is generally a member of a 12-Step fellowship who helps another member
      work through the program. The exact nature of sponsorship can vary considerably
      because the relationship is primarily between the sponsor and the person they
      sponsor. Different sponsors can therefore provide very different types and amounts
      of guidance.
  - question: Which is better, SMART Recovery or 12-Step?
    response: >-
      There is no single answer that applies to everyone. Different people respond
      to different philosophies, environments, tools, and forms of support. Some people
      strongly prefer SMART Recovery, some prefer 12-Step programs, and some use multiple
      recovery resources.
  - question: Can I attend SMART Recovery and 12-Step meetings?
    response: >-
      Yes. People sometimes use multiple recovery resources. The important question
      is whether the combination is helping you make meaningful progress and whether
      you understand the philosophical differences between the approaches.
- name: my_smart_recovery_experience
  title: My SMART Recovery Experience
  questions:
  - question: Do you facilitate SMART Recovery?
    response: >-
      Yes. I am a Certified SMART Recovery Facilitator. I previously facilitated the
      SMART Recovery group at Recovery At The Cross Roads in Blackwood, New Jersey,
      together with fellow certified facilitator Crystal Martin.
  - question: What does your SMART Recovery experience mean for your work?
    response: >-
      My experience facilitating SMART Recovery gives me practical experience with
      recovery education, group discussion, behavior-change tools, and helping people
      apply recovery concepts to real-life situations. It also reinforces my belief
      that recovery should involve learning practical skills that people can use outside
      the meeting.
  - question: Are you a SMART Recovery therapist?
    response: >-
      No. A SMART Recovery facilitator and a therapist have different roles. Facilitation
      involves education, discussion, mutual support, and helping participants work
      with SMART Recovery tools. It is not the same thing as providing psychotherapy,
      medical treatment, or clinical diagnosis.
- name: a_different_way_of_thinking_about_recovery
  title: A Different Way of Thinking About Recovery
  questions:
  - question: Why do you emphasize self-reliance in recovery?
    response: >-
      Because the ultimate goal is to live your life, not spend your life managing
      your recovery through constant dependence on another person or institution.
      Support can be extremely valuable, but ideally that support helps you develop
      your own understanding, skills, judgment, and confidence.
  - question: Does self-reliance mean I should recover completely on my own?
    response: >-
      No. Self-reliance does not mean isolation. Human beings benefit from relationships,
      community, professional expertise, education, and mutual support. The distinction
      is between using support to become more capable and believing that you cannot
      function without a particular person or group.
  - question: Why is learning skills so important in recovery?
    response: >-
      Because recovery happens in ordinary life. Knowing what you should do is different
      from being able to do it when you are stressed, angry, frustrated, lonely, tempted,
      or overwhelmed. Skills become useful when they are practiced and eventually
      become available when they are needed.
  - question: Why isn't information alone enough?
    response: >-
      Knowing that smoking, drinking, gambling, or another behavior is harmful does
      not automatically change the behavior. People generally need more than information.
      They need opportunities to examine their patterns, practice alternatives, develop
      motivation, and learn how to respond differently when difficult situations occur.
  - question: What does lasting recovery look like?
    response: >-
      Lasting recovery is not simply the absence of an addictive behavior. It is the
      development of a life in which the person has meaningful choices, healthier
      ways of handling problems, useful relationships, purpose, balance, and confidence
      in their ability to deal with difficult situations.
- name: getting_help
  title: Getting Help
  questions:
  - question: When should I seek professional help for addiction?
    response: >-
      If an addictive behavior is causing significant harm, interfering with work
      or relationships, creating legal or financial problems, damaging physical or
      mental health, or repeatedly continuing despite attempts to stop, seeking help
      is appropriate. Some substances can produce dangerous withdrawal, so medical
      guidance may be especially important when stopping suddenly.
  - question: Can hypnosis be used together with professional treatment?
    response: >-
      Potentially, yes. Hypnosis can be considered as a complementary approach alongside
      appropriate medical, behavioral, counseling, or recovery services. Communication
      among providers can be useful when multiple forms of care are being used.
  - question: What if I have tried treatment before and it didn't work?
    response: >-
      A previous unsuccessful attempt does not mean that recovery is impossible. It
      may mean that something about the approach, environment, timing, underlying
      problems, aftercare, or application of the skills did not work for you. Instead
      of simply repeating the same strategy, it can be useful to examine what happened
      and what might need to be different this time.
  - question: What if I am not sure whether I have an addiction?
    response: >-
      You do not necessarily need to settle on a label before asking for help. A useful
      starting point is to examine the behavior itself. Is it causing problems? Have
      you tried to change it? Do you continue despite consequences? Does it interfere
      with the life you want? Those questions can be more useful than arguing over
      a label.
  - question: How can I find out whether your approach is right for me?
    response: >-
      The best place to start is with a conversation about what is happening, what
      you have already tried, what you want to change, and what kind of support you
      are looking for. A consultation can help determine whether hypnosis or another
      approach makes sense for your situation.
  - question: What if I need medical or emergency help?
    response: >-
      Hypnosis and peer recovery support are not substitutes for emergency or medical
      care. If you are experiencing a medical emergency, dangerous withdrawal, overdose,
      or another immediate health crisis, seek emergency medical assistance. Recovery
      support can be added to appropriate medical care rather than replacing it.

