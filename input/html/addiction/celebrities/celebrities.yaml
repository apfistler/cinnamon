  babylon_5:
    - id: "jeff_conaway"
      image: "/img/addiction/celebrities/jeff_conaway.png"
      link: "/addiction/celebrities/jeff_conaway.html"
      title: "Jeff Conaway — Zack Allan"
      content: >
        Jeff Conaway, best known for Grease, Taxi, and Babylon 5, publicly struggled with cocaine, alcohol, and prescription painkillers. His addiction became particularly intertwined with severe back pain and long-term use of pain medication.

        Conaway played Zack Allan on Babylon 5 and later appeared on Celebrity Rehab. He died in 2011 following severe medical complications after years of addiction and health problems.

        His story illustrates the complicated relationship between chronic pain, prescription medication, physical dependence, addiction, and recovery.

    - id: "claudia_christian"
      image: "/img/addiction/celebrities/claudia_christian.png"
      link: "/addiction/celebrities/claudia_christian.html"
      title: "Claudia Christian — Susan Ivanova"
      content: >
        Claudia Christian played Susan Ivanova on Babylon 5 and later openly described her struggle with alcohol dependence.

        After finding success with naltrexone and the Sinclair Method, she became an advocate for medication-assisted treatment and founded the C Three Foundation.

        Her story is especially relevant because it demonstrates how someone can move from addiction and difficulty controlling alcohol use into recovery and then use that experience to educate others about alternative approaches to treatment.

    - id: "jerry_doyle"
      image: "/img/addiction/celebrities/jerry_doyle.png"
      link: "/addiction/celebrities/jerry_doyle.html"
      title: "Jerry Doyle — Michael Garibaldi"
      content: >
        Jerry Doyle played Michael Garibaldi on Babylon 5, one of science fiction television's most sustained portrayals of a recovering and relapsing alcoholic.

        Doyle died in 2016 at age 60. The Clark County Coroner reported that complications from chronic alcoholism contributed to his death.

        Garibaldi's fictional history and Doyle's real-life struggle make Babylon 5's treatment of addiction particularly poignant: the series gave addiction a continuing role in a competent character's life rather than treating it as a temporary plot device.
